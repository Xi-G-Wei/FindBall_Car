        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32f1x
      probe-rs:
        allowEraseAll: false
        baseAddr: "0x08000000"
        bin: ""
        otherOptions: ""
        protocol: swd
        speed: 0
        target: STM32F103C8
    uploader: OpenOCD
